server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: vtc-crm-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vtc_crm_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:vasavi-trading-company-super-secret-jwt-key-2026-coffee-enterprise-crm}
  expiration: 86400000

logging:
  level:
    com.vtc.crm: INFO
    org.springframework.security: WARN

